run:
  name: test-run
  ckpt_dir: ckpt
  device: mps
  precision: bf16-mixed
  seed: 1998
optimizer:
  batch_size: 2
  num_epochs: 2
  weight_decay: 0.01
  learning_rate: 1e-3
  warmup_ratio: 0.05
model:
  base_lm: google/gemma-3-270m-it
  lora_rank: 8
  lora_scaling_factor: 8
  lora_dropout: 0.1
  max_length: 1024
data:
  root: data/proofjudge
