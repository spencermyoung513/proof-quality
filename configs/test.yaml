run:
  name: test-run
  ckpt_dir: ckpt
  device: mps
  precision: bf16-mixed
  seed: 1998
optimizer:
  batch_size: 2
  accumulate_grad_batches: 4
  num_epochs: 10
  weight_decay: 0.00
  learning_rate: 2e-4
  warmup_ratio: 0.05
model:
  base_lm: google/gemma-3-270m-it
  lora_rank: 32
  lora_scaling_factor: 32
  lora_dropout: 0.0
  max_length: 1024
data:
  root: data/mathlibpr
